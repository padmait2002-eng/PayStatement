spring:
  application:
    name: paystatement
  profiles:
    default: local
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:paystatement-service}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.paystatement.services.dto
        spring.json.value.default.type: com.paystatement.services.dto.GenerateStatementRequest
paystatement:
  cors:
    allowed-origins: ${PAYSTATEMENT_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:4200,http://127.0.0.1:4200}
  kafka:
    enabled: ${PAYSTATEMENT_KAFKA_ENABLED:false}
    generate-topic: ${PAYSTATEMENT_KAFKA_GENERATE_TOPIC:paystatement.generate}
    generated-topic: ${PAYSTATEMENT_KAFKA_GENERATED_TOPIC:paystatement.generated}
server:
  port: ${SERVER_PORT:8080}
