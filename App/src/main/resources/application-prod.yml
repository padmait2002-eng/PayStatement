spring:
  datasource:
    url: ${DATABASE_URL:jdbc:h2:mem:paystatement-prod;DB_CLOSE_DELAY=-1}
    driver-class-name: ${DATABASE_DRIVER:org.h2.Driver}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${ADFS_ISSUER_URI}
paystatement:
  kafka:
    enabled: ${PAYSTATEMENT_KAFKA_ENABLED:true}
